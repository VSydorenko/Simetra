# Garage стека розробки `postgres`: один вузол, без реплікації. `rpc_secret`
# і `admin_token` сюди не пишуться — Garage бере їх із середовища
# (`GARAGE_RPC_SECRET`, `GARAGE_ADMIN_TOKEN` з `dev-secrets.env`), щоб секрети
# стека жили в одному файлі.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"

[admin]
api_bind_addr = "0.0.0.0:3903"
