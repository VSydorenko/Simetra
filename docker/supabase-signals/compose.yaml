# Centrifugo поруч зі спільним стеком Supabase (він живе поза цим файлом:
# `pnpm db:start`). Запускати лише через `pnpm db:signals:start` /
# `pnpm db:signals:stop`: `db:start` і `db:stop` цей проєкт не чіпають.
# Порт — лише на 127.0.0.1: Docker інакше відкриває його на всіх інтерфейсах
# в обхід брандмауера. Проєкт окремий (`simetra-sb`), щоб `down` не зачепив
# контейнери Supabase.
name: simetra-sb

services:
  centrifugo:
    image: centrifugo/centrifugo:v6.10.2@sha256:34b84f823515927266ce3abfb840fd9e0acabb58805e7e896f5de731217a627d
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    ports:
      - "127.0.0.1:8101:8000"
    volumes:
      - ./centrifugo.json:/centrifugo/config.json:ro
    # curl в образі немає; wget — з busybox образу, а власної команди перевірки
    # здоров'я Centrifugo не має
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 5s
      retries: 30
