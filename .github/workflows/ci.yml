name: CI

on:
  pull_request:
  push:
    branches: [main]

# Лише читання: CI нічого не публікує і не пише в репозиторій
permissions:
  contents: read

# Новий пуш у той самий PR скасовує застарілий прогін; на main не скасовуємо,
# щоб кожен коміт у main мав власний результат CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Чи змінює подія код (#249). PR лише з документацією не ганяє бази,
  # пакування й шаблон host-а; `Checks` біжить завжди. Фільтр на рівні job,
  # не `paths:` в `on:`: без прогону CI `pr-gate land` не мерджить, а формат
  # документації ніхто б не перевірив. Push у main ганяє все завжди.
  # Умова jobs — `!= 'false'`: порожній вихід (скрипт нічого не надрукував)
  # ганяє все, а не тихо пропускає перевірки
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Три крапки в diff потребують спільного предка бази й голови PR
          fetch-depth: 0
      # Класифікатор — `.mts`: Node з .node-version виконує його без збірки
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # Збій diff валить job, і залежні jobs не біжать — червоне, не тихий пропуск
      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          node scripts/ci/docs-only.mts < "$RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Версію pnpm бере з поля packageManager у package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Одна політика версій для спільних залежностей пакетів (syncpack):
      # розсинхрон тихо дає дві копії залежності в дереві споживача
      - name: Dependency versions check
        run: pnpm deps:check
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Metadata check
        run: pnpm metadata:check

  # DB-тести (проєкт db) йдуть проти стека postgres: Postgres, Centrifugo, Garage.
  # Шарди — окремі раннери, кожен зі своїм стеком: DB-тести designer на
  # 4 ядрах раннера не вкладалися в одну джобу (кейс будує тінь і копію через
  # pg-delta). Локально `pnpm test:db:pg` лишається одним послідовним прогоном.
  db:
    name: Database (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Червоний шард не скасовує решту: видно всі падіння одного прогону
      fail-fast: false
      matrix:
        include:
          # Повторний старт стека має завершитися кодом 0 (стек не
          # перестворюється), потім — базовий стан і тести simetra
          - name: postgres base state + simetra
            run: pnpm db:pg:start --no-build && pnpm --filter simetra test:db
          - name: designer 1/4
            run: pnpm --filter @simetrajs/designer test:db --shard=1/4
          - name: designer 2/4
            run: pnpm --filter @simetrajs/designer test:db --shard=2/4
          - name: designer 3/4
            run: pnpm --filter @simetrajs/designer test:db --shard=3/4
          - name: designer 4/4
            run: pnpm --filter @simetrajs/designer test:db --shard=4/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Версію pnpm бере з поля packageManager у package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Тег образу береться з compose-файла, а не дублюється тут; хеш файлів
      # стека стає міткою образу: без неї мітка `simetra.stack-files-hash`
      # порожня, і другий `db:pg:start` відмовить
      - name: Stack image inputs
        id: image
        run: |
          echo "tag=$(grep -oE 'simetra-pg/postgres:[^ ]+' docker/postgres-stack/compose.yaml | head -1)" >> "$GITHUB_OUTPUT"
          echo "files-hash=$(node scripts/db-stack.mjs files-hash postgres)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Образ збирається тут, з кешем шарів: `compose up --build` має власний
      # builder і кешу GitHub Actions не бачить. Старт нижче йде з `--no-build`
      - name: Build postgres image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/postgres-stack
          load: true
          push: false
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SIMETRA_STACK_FILES_HASH=${{ steps.image.outputs.files-hash }}
      # Повтор старту: невдалий старт лишає контейнери й том напівствореного
      # стека; `--volumes` прибирає їх між спробами. Свіжий раннер даних не
      # має, тож нічого не губимо. Не більше двох повторів, щоб справжня
      # поломка падала швидко
      - name: Start postgres stack
        run: |
          for attempt in 1 2 3; do
            if pnpm db:pg:start --no-build; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "::warning::postgres stack start failed (attempt $attempt), cleaning up and retrying"
            node scripts/db-stack.mjs stop postgres --volumes || true
            sleep $((attempt * 30))
          done
          exit 1
      - name: Database tests
        run: ${{ matrix.run }}

  # Тести, що вимагають стека Supabase (проєкт db-supabase), і набір базового
  # стану провайдера. Шарди — з тієї самої причини, що в db: один рядок
  # перевищив би timeout-minutes
  db-supabase:
    name: Database Supabase (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: provider + simetra
            run: pnpm exec supabase test db && pnpm --filter simetra test:db:supabase
          - name: designer 1/2
            run: pnpm --filter @simetrajs/designer test:db:supabase --shard=1/2
          - name: designer 2/2
            run: pnpm --filter @simetrajs/designer test:db:supabase --shard=2/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Версію pnpm бере з поля packageManager у package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Повтор старту: невдалий `supabase start` (вичерпані повтори тягнення
      # образів, порт, зайнятий напівствореним контейнером цього ж старту)
      # лишає контейнери й мережу проєкту. `supabase stop --no-backup` прибирає
      # їх за міткою проєкту; даних у свіжого раннера немає, тож нічого не
      # губимо. Не більше двох повторів, щоб справжня поломка падала швидко
      - name: Start Supabase stack
        run: |
          for attempt in 1 2 3; do
            if pnpm db:start; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "::warning::supabase start failed (attempt $attempt), cleaning up and retrying"
            pnpm exec supabase stop --no-backup || true
            sleep $((attempt * 30))
          done
          exit 1
      - name: Database tests
        run: ${{ matrix.run }}

  # Гейт пакування: пакує tarball-и так, як їх побачить реєстр, і ставить їх
  # у тимчасовий проєкт споживача через npm (імпорт ярусів, CLI, MCP)
  packaging:
    name: Packaging
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Версію pnpm бере з поля packageManager у package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages
      - name: Packaging tests
        run: pnpm test:packaging

  # Шаблон host-а (П4-D, D2): DB-тести шаблону, склад збірки й збірка з
  # tarball-ів, безпекові e2e на production-збірці. Нога матриці — {браузер,
  # збірка}: нові ноги (WebKit, dev-збірка, бюджети) додаються рядками матриці
  # (#210), а не новим job. Секрети прогону — випадкові на прогін: фікстура
  # сама генерує `BETTER_AUTH_SECRET` і паролі користувачів, секретів репо тут
  # немає.
  host-template:
    name: Host template (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium production
            browser: chromium
            build: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Версію pnpm бере з поля packageManager у package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Той самий образ стека, що й у job `db`: тег із compose-файла, мітка
      # хеша файлів стека
      - name: Stack image inputs
        id: image
        run: |
          echo "tag=$(grep -oE 'simetra-pg/postgres:[^ ]+' docker/postgres-stack/compose.yaml | head -1)" >> "$GITHUB_OUTPUT"
          echo "files-hash=$(node scripts/db-stack.mjs files-hash postgres)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build postgres image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/postgres-stack
          load: true
          push: false
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SIMETRA_STACK_FILES_HASH=${{ steps.image.outputs.files-hash }}
      - name: Start postgres stack
        run: |
          for attempt in 1 2 3; do
            if pnpm db:pg:start --no-build; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "::warning::postgres stack start failed (attempt $attempt), cleaning up and retrying"
            node scripts/db-stack.mjs stop postgres --volumes || true
            sleep $((attempt * 30))
          done
          exit 1
      # Збірка з tarball-ів і e2e потребують зібраних пакетів
      - name: Build packages
        run: pnpm build:packages
      # Браузер точного піна Playwright (версія — у package.json пакета) із
      # системними залежностями
      - name: Install browser
        run: pnpm --filter create-simetra-app exec playwright install --with-deps ${{ matrix.browser }}
      - name: Template database tests
        run: pnpm --filter create-simetra-app-template test:db
      - name: Build content and tarball build
        run: pnpm --filter create-simetra-app test:build
      - name: Security e2e
        run: pnpm --filter create-simetra-app e2e --project=${{ matrix.browser }}-${{ matrix.build }}
      # Червоне на хибно-зеленому: `skipped`, `flaky` чи нуль тестів Playwright
      # рахує успіхом, а звіт — ні
      - name: Playwright report gate
        run: pnpm --filter create-simetra-app e2e:gate
