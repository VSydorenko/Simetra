name: CI

on:
  pull_request:
  push:
    branches: [main]

# Лише читання: CI нічого не публікує і не пише в репозиторій
permissions:
  contents: read

# Новий пуш у той самий PR скасовує застарілий прогін; на main не скасовуємо,
# щоб кожен коміт у main мав власний результат CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Версію pnpm бере з поля packageManager у package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Metadata check
        run: pnpm metadata:check

  # DB-тести йдуть проти того самого стеку й образу провайдера, що в dev.
  # Шарди — окремі раннери, кожен зі своїм стеком: DB-тести designer на
  # 4 ядрах раннера не вкладалися в одну джобу (кейс будує тінь і копію через
  # pg-delta). Локально `pnpm test:db` лишається одним послідовним прогоном.
  db:
    name: Database (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Червоний шард не скасовує решту: видно всі падіння одного прогону
      fail-fast: false
      matrix:
        include:
          - name: provider + simetra
            run: pnpm exec supabase test db && pnpm --filter simetra test:db
          - name: designer 1/4
            run: pnpm --filter @simetrajs/designer test:db --shard=1/4
          - name: designer 2/4
            run: pnpm --filter @simetrajs/designer test:db --shard=2/4
          - name: designer 3/4
            run: pnpm --filter @simetrajs/designer test:db --shard=3/4
          - name: designer 4/4
            run: pnpm --filter @simetrajs/designer test:db --shard=4/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Версію pnpm бере з поля packageManager у package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start Supabase stack
        run: pnpm db:start
      - name: Database tests
        run: ${{ matrix.run }}

  # Гейт пакування: пакує tarball-и так, як їх побачить реєстр, і ставить їх
  # у тимчасовий проєкт споживача через npm (імпорт ярусів, CLI, MCP)
  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Версію pnpm бере з поля packageManager у package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages
      - name: Packaging tests
        run: pnpm test:packaging
